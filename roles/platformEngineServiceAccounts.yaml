# The Config Connector engine's service-account permissions (ADR-0018 §2).
# Replaces roles/iam.serviceAccountAdmin (19) with the 6 its calls need.
# Delete stays: a tenant's service account is meant to go when the tenant
# goes. Left out on purpose: disable, enable, undelete, list, API-key
# bindings and tags. Keys and the act-as-another-account verbs were never in
# the built-in role, and this repo's check keeps them from being added.
title: Platform engine - service accounts
description: What Config Connector needs to create, update and delete each System's Google service account and its Workload Identity binding (ADR-0018).
stage: GA
includedPermissions:
  - iam.serviceAccounts.create
  - iam.serviceAccounts.delete
  - iam.serviceAccounts.get
  - iam.serviceAccounts.getIamPolicy
  - iam.serviceAccounts.setIamPolicy
  - iam.serviceAccounts.update
